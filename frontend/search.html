<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find result - Result Manager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
  <span class="brand">Result Manager</span>
  <a href="index.html">Add student</a>
  <a href="search.html" class="active">Find result</a>
  <a href="dashboard.html">Class summary</a>
</nav>
<main>
  <h1>Find a result</h1>
  <p class="lead">Search by roll number or by name.</p>
  <form id="search-form" class="card">
    <div class="search-row">
      <div>
        <label for="search-by">Search by</label>
        <select id="search-by"><option value="roll">Roll number</option><option value="name">Name</option></select>
      </div>
      <div><label for="search-value">Roll number or name</label><input id="search-value" required></div>
      <button type="submit">Search</button>
    </div>
    <p id="message" class="message" role="status"></p>
  </form>
  <div id="results"></div>
</main>
<script src="js/app.js"></script>
</body>
</html>
