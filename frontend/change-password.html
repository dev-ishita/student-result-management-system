<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password - Result Manager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
  <span class="brand">Result Manager</span>
  <a href="index.html">Add student</a>
  <a href="search.html">Find result</a>
  <a href="dashboard.html">Class summary</a>
</nav>
<main class="narrow">
  <h1>Change password</h1>
  <p id="first-login-note" class="notice" hidden>Your password is still the default. Choose a new one before you continue.</p>
  <form id="change-form" class="card">
    <div class="field"><label for="current-password">Current password</label><input id="current-password" type="password" autocomplete="current-password" required></div>
    <div class="field"><label for="new-password">New password (at least 6 characters)</label><input id="new-password" type="password" minlength="6" autocomplete="new-password" required></div>
    <div class="field"><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" minlength="6" autocomplete="new-password" required></div>
    <button type="submit">Change password</button>
    <p id="message" class="message" role="status"></p>
  </form>
</main>
<script src="js/app.js"></script>
</body>
</html>
