<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add student - Result Manager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
  <span class="brand">Result Manager</span>
  <a href="index.html" class="active">Add student</a>
  <a href="search.html">Find result</a>
  <a href="dashboard.html">Class summary</a>
</nav>
<main>
  <h1>Add a student</h1>
  <p class="lead">Enter the student's details and marks. Grade and percentage are calculated automatically.</p>
  <form id="student-form" class="card">
    <div class="row">
      <div><label for="rollNo">Roll number</label><input id="rollNo" name="rollNo" required></div>
      <div><label for="name">Full name</label><input id="name" name="name" required></div>
      <div><label for="className">Class</label><input id="className" name="className" placeholder="e.g. 10A" required></div>
    </div>
    <h2>Subjects</h2>
    <div id="subjects">
      <div class="subject-row">
        <input name="subjectName" placeholder="Subject" aria-label="Subject name" required>
        <input name="marksObtained" type="number" min="0" step="any" placeholder="Marks" aria-label="Marks obtained" required>
        <input name="maxMarks" type="number" min="1" step="any" value="100" aria-label="Maximum marks" required>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="add-subject" class="secondary">Add subject</button>
      <button type="submit">Save student</button>
    </div>
    <p id="message" class="message" role="status"></p>
  </form>
</main>
<script src="js/app.js"></script>
</body>
</html>
