<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in - Result Manager</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav><span class="brand">Result Manager</span></nav>
<main class="narrow">
  <h1>Log in</h1>
  <p class="lead">Teachers manage students and results. Students see their own result.</p>
  <form id="login-form" class="card">
    <div class="field"><label for="username">Username</label><input id="username" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button type="submit">Log in</button>
    <p id="message" class="message" role="status"></p>
    <p class="hint">Students: your roll number is both your username and your first password. Teacher demo account: teacher / teacher123.</p>
  </form>
</main>
<script src="js/app.js"></script>
</body>
</html>
